name: pbx_client_sample
description: >
  Asterisk soft client supporting WebRTC (WSS) and standard SIP modes,
  with CallKit (iOS) and ConnectionService (Android) integration.
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── SIP / WebRTC ────────────────────────────────────────────────────────────
  # SIP UA: handles SIP signalling over WebSocket (WSS) and classic UDP/TCP
  sip_ua: ^0.4.0
  # WebRTC media stack
  flutter_webrtc: ^0.10.0

  # ── Call Control (CallKit / ConnectionService) ───────────────────────────────
  webtrit_callkeep: ^0.3.0

  # ── State Management ─────────────────────────────────────────────────────────
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ── Local Storage ────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.3

  # ── Networking / Utils ───────────────────────────────────────────────────────
  # UUID generator for SIP session IDs
  uuid: ^4.4.0
  # Logger
  logger: ^2.3.0
  # Permission handling (microphone, camera)
  permission_handler: ^11.3.1
  # Wakelock to prevent screen off during a call
  wakelock_plus: ^1.2.5

  # ── UI ───────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
